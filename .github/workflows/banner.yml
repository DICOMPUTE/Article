name: banner

# Generates an editorial banner (engine A, procedural -- no API keys, no
# network) for any post touched by a pull request that has no banner, and
# commits it to the pull request branch. See README.md, "Banner generation",
# and docs/banner-style.md for the house style.

on:
  pull_request:
    paths:
      - "blog/**"
      - "scripts/banner/**"
      - ".github/workflows/banner.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: banner-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Fork pull requests get no write token in this repository, so banner
      # generation (which commits to the PR branch) cannot run there. Note it
      # on the PR and stop; a maintainer runs the generator after merging.
      - name: Note fork pull requests
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "The banner generator does not run on fork pull requests (no write token here). If this post needs a generated banner, a maintainer can run it after merging: \`workflow_dispatch\` of the \`banner\` workflow, or locally \`bun scripts/banner/generate.ts --slugs <slug>\`. The post ships fine without one — the site's gradient fallback serves until a banner lands."
          echo "skipped: fork pull request"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        if: !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        with:
          bun-version: "1.4.0"

      - name: Install the WebP encoder
        if: !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        run: sudo apt-get update && sudo apt-get install -y webp

      - name: Which posts need a banner
        if: !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork)
        id: posts
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            slugs=$(ls blog/*.md | sed -E 's|.*/[0-9]{4}-[0-9]{2}-[0-9]{2}-(.*)\.md$|\1|')
          else
            slugs=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" -- 'blog/*.md' | sed -E 's|.*/[0-9]{4}-[0-9]{2}-[0-9]{2}-(.*)\.md$|\1|')
          fi
          slugs=$(printf '%s\n' "$slugs" | sort -u | grep -v '^$' | paste -sd, - || true)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"

      - name: Generate banners
        if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.posts.outputs.slugs != '')
        run: bun scripts/banner/generate.ts --slugs "${{ steps.posts.outputs.slugs }}"

      # The site re-validates every commit with its own copy of these rules
      # and refuses to publish one that fails -- so the generator's commit
      # must pass this repository's own validator before it is pushed.
      - name: Validate
        if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.posts.outputs.slugs != '')
        run: bun scripts/validate.ts

      - name: Commit to the pull request branch
        if: (github.event_name == 'workflow_dispatch') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false && steps.posts.outputs.slugs != '')
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(banner): generate editorial banner(s) for post(s) without one"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            git push origin "HEAD:${{ github.ref_name }}"
          else
            git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          fi
